<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="link-da-web.png" type="image/png" />
  <link rel="stylesheet" href="/styles/global.css" />
  <title>Mentor Paulo Freire</title>
  <style>
    .container {
      max-width: 800px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 3rem);
      max-height: 860px;
      overflow: hidden;
    }

    .header {
      padding: 1.5rem 2rem 1.25rem;
      border-bottom: 1px solid var(--surface-muted);
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--color-primary), var(--color-optional));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.025em;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .header-actions a,
    .header-actions button {
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-nav {
      background: var(--surface-muted);
      color: var(--text-muted);
    }

    .btn-nav:hover {
      background: var(--border-primary);
      color: var(--text-primary);
    }

    .btn-reset {
      background: var(--color-error-soft);
      color: var(--color-error);
    }

    .btn-reset:hover {
      background: var(--color-error-border);
    }

    .subtitle {
      color: var(--text-subtle);
      font-size: 0.9rem;
      margin-top: 0.35rem;
      line-height: 1.4;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar {
      width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-area::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 999px;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, var(--color-primary), var(--color-optional));
    }

    .message.user .avatar {
      background: linear-gradient(135deg, var(--color-success), var(--color-success-active));
    }

    .bubble {
      padding: 0.85rem 1.1rem;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .bubble p { margin: 0 0 0.6rem; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble ul, .bubble ol {
      padding-left: 1.4rem;
      margin: 0 0 0.6rem;
    }

    .bubble li { margin-bottom: 0.2rem; }

    .bubble code {
      background: rgba(255,255,255,0.12);
      padding: 0.1em 0.35em;
      border-radius: 5px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.88em;
    }

    .message.user .bubble code {
      background: rgba(255,255,255,0.2);
    }

    .bubble pre {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    .bubble strong { font-weight: 700; }

    .bubble h1, .bubble h2, .bubble h3 {
      margin: 0.5rem 0 0.3rem;
      font-weight: 700;
    }

    .bubble h1 { font-size: 1.05rem; }
    .bubble h2 { font-size: 1rem; }
    .bubble h3 { font-size: 0.95rem; }

    .message.assistant .bubble {
      background: var(--surface-muted);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--color-primary), var(--color-optional));
      color: var(--text-primary);
      border-bottom-right-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      gap: 0.75rem;
      align-self: flex-start;
      max-width: 85%;
      align-items: flex-end;
    }

    .typing-bubble {
      background: var(--surface-muted);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 0.85rem 1.1rem;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-disabled);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-6px);
      }
    }

    .input-area {
      padding: 1.25rem 2rem 1.5rem;
      border-top: 1px solid var(--surface-muted);
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea#userInput {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border-primary);
      border-radius: 16px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: var(--bg-surface);
      outline: none;
      resize: none;
      overflow-y: auto;
      line-height: 1.5;
    }

    textarea#userInput:focus {
      border-color: var(--color-primary);
      box-shadow: var(--focus-ring);
    }

    textarea#userInput:disabled {
      background: var(--surface-soft);
      opacity: 0.7;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--color-primary), var(--color-optional));
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
    }

    #sendBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(59, 130, 246, 0.4);
    }

    #sendBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .welcome-hint {
      text-align: center;
      color: var(--text-disabled);
      font-size: 0.88rem;
      margin: auto 0;
      padding: 2rem;
    }

    .welcome-hint .icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .welcome-hint p {
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .container {
        border-radius: 0;
        height: 100vh;
        max-height: none;
      }

      .header {
        padding: 1rem 1.25rem;
      }

      .chat-area {
        padding: 1rem 1.25rem;
      }

      .input-area {
        padding: 0.75rem 1.25rem 1rem;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <h1>Mentor Paulo Freire</h1>
        <div class="header-actions">
          <a class="btn-nav" href="/">🔗 Links</a>
          <a class="btn-nav" href="/estudos">📚 Estudos</a>
          <button class="btn-reset" id="resetBtn" title="Reiniciar conversa">↺ Reiniciar</button>
        </div>
      </div>
      <p class="subtitle">Aprendizagem ativa com ciclos de fixação — método Paulo Freire</p>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome-hint" id="welcomeHint">
        <span class="icon">🧠</span>
        <p>Inicie a conversa! O mentor vai perguntar qual tema você quer aprender e em qual nível você está.</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="userInput"
        placeholder="Digite sua mensagem... (Enter para enviar, Shift+Enter para quebra de linha)" rows="1"></textarea>
      <button id="sendBtn" title="Enviar mensagem" aria-label="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    let messages = [];
    let isLoading = false;

    const autoResize = () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
    };

    const scrollToBottom = () => {
      chatArea.scrollTop = chatArea.scrollHeight;
    };

    const setLoading = (loading) => {
      isLoading = loading;
      userInput.disabled = loading;
      sendBtn.disabled = loading;
    };

    const createBubble = (role) => {
      const hint = document.getElementById('welcomeHint');
      if (hint) hint.remove();

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'assistant' ? '🎓' : '🙋';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatArea.appendChild(wrapper);
      scrollToBottom();
      return bubble;
    };

    const appendMessage = (role, content) => {
      const bubble = createBubble(role);
      if (role === 'assistant') {
        bubble.innerHTML = marked.parse(content);
      } else {
        bubble.textContent = content;
      }
    };

    const streamIntoMessage = async (fetchBody) => {
      const res = await fetch('/mentor-chat-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fetchBody),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.details || data.error || 'Erro desconhecido');
      }

      hideTyping();
      const bubble = createBubble('assistant');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() ?? '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') return fullText;
          try {
            const token = JSON.parse(data);
            if (typeof token === 'string') {
              fullText += token;
              bubble.innerHTML = marked.parse(fullText);
              scrollToBottom();
            }
          } catch {}
        }
      }

      return fullText;
    };

    const showTyping = () => {
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.id = 'typingIndicator';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🎓';

      const bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      indicator.appendChild(avatar);
      indicator.appendChild(bubble);
      chatArea.appendChild(indicator);
      scrollToBottom();
    };

    const hideTyping = () => {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    };

    const sendMessage = async () => {
      const text = userInput.value.trim();
      if (!text || isLoading) return;

      userInput.value = '';
      autoResize();

      messages.push({ role: 'user', content: text });
      appendMessage('user', text);

      setLoading(true);
      showTyping();

      try {
        const fullText = await streamIntoMessage({ messages });
        messages.push({ role: 'assistant', content: fullText });
      } catch (err) {
        hideTyping();
        appendMessage('assistant', '⚠️ Erro ao contatar o mentor: ' + err.message);
      } finally {
        setLoading(false);
        userInput.focus();
      }
    };

    const startGreeting = async () => {
      const trigger = { role: 'user', content: '__init__' };
      setLoading(true);
      showTyping();
      try {
        const fullText = await streamIntoMessage({ messages: [trigger] });
        messages = [trigger, { role: 'assistant', content: fullText }];
      } catch (err) {
        hideTyping();
        appendMessage('assistant', '⚠️ Erro ao iniciar o mentor: ' + err.message);
      } finally {
        setLoading(false);
        userInput.focus();
      }
    };

    const resetChat = async () => {
      messages = [];
      chatArea.innerHTML = '';
      const hint = document.createElement('div');
      hint.className = 'welcome-hint';
      hint.id = 'welcomeHint';
      hint.innerHTML = '<span class="icon">🧠</span><p>Reiniciando...</p>';
      chatArea.appendChild(hint);
      userInput.value = '';
      autoResize();
      await startGreeting();
    };

    // Register handlers only after all functions are defined
    userInput.addEventListener('input', autoResize);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);
    resetBtn.addEventListener('click', resetChat);

    // Load initial greeting
    startGreeting();
  </script>
</body>

</html>
