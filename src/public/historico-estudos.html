<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="link-da-web.png" type="image/png" />
  <title>Historico de Estudos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-start: #0f172a;
      --bg-end: #1d4ed8;
      --card: rgba(255, 255, 255, 0.95);
      --text: #111827;
      --muted: #4b5563;
      --accent: #0ea5e9;
      --ok: #10b981;
      --line: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.2), transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.16), transparent 35%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(2, 6, 23, 0.55);
      animation: rise 0.45s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .top-actions a,
    .top-actions button {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-back {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-study {
      background: #dbeafe;
      color: #1e3a8a;
    }

    .btn-refresh {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      box-shadow: 0 10px 18px -10px rgba(37, 99, 235, 0.8);
    }

    .top-actions a:hover,
    .top-actions button:hover {
      transform: translateY(-2px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
      background: #f8fafc;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
    }

    #historyList {
      display: grid;
      gap: 0.75rem;
      max-height: 480px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.95rem;
      background: white;
    }

    .history-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .cycle-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.62rem;
      border-radius: 999px;
      background: #ecfeff;
      color: #0e7490;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score {
      color: var(--ok);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .prompt {
      font-weight: 600;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--line);
      color: #374151;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed #93c5fd;
      border-radius: 14px;
      background: #eff6ff;
      color: #1e3a8a;
      padding: 1rem;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .container {
        padding: 1.25rem;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Historico de Estudos</h1>
    <p class="subtitle">Aqui ficam todos os ciclos concluidos. Cada card mostra o tema estudado, o ciclo e quando ele
      foi finalizado.</p>

    <div class="top-actions">
      <a class="btn-back" href="/">Voltar para links</a>
      <a class="btn-study" href="/estudos">Ir para estudos</a>
      <button class="btn-refresh" id="refreshBtn" type="button">Atualizar historico</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Ciclos concluidos</div>
        <div class="stat-value" id="totalCycles">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Temas estudados</div>
        <div class="stat-value" id="totalThemes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ultima conclusao</div>
        <div class="stat-value" id="lastCompletion">-</div>
      </div>
    </div>

    <div id="historyList"></div>
  </div>

  <script>
    function renderStats(history) {
      const totalCycles = document.getElementById('totalCycles');
      const totalThemes = document.getElementById('totalThemes');
      const lastCompletion = document.getElementById('lastCompletion');

      totalCycles.textContent = history.length;

      const themes = new Set(history.map((item) => item.promptSnapshot));
      totalThemes.textContent = themes.size;

      if (!history.length) {
        lastCompletion.textContent = '-';
        return;
      }

      const date = new Date(history[0].completedAt);
      lastCompletion.textContent = Number.isNaN(date.getTime()) ? '-' : date.toLocaleDateString('pt-BR');
    }

    function renderHistory(history) {
      const list = document.getElementById('historyList');
      renderStats(history);

      if (!history.length) {
        list.innerHTML = '<div class="empty">Nenhum ciclo concluido ainda. Complete um ciclo na area de estudos para aparecer aqui.</div>';
        return;
      }

      list.innerHTML = '';
      history.forEach((item) => {
        const wrapper = document.createElement('article');
        wrapper.className = 'history-item';

        const completedAt = new Date(item.completedAt);
        const completedLabel = Number.isNaN(completedAt.getTime())
          ? item.completedAt
          : completedAt.toLocaleString('pt-BR');

        wrapper.innerHTML = `
          <div class="history-head">
            <span class="cycle-badge">ciclo ${item.cycleNumber}</span>
            <span class="score">${item.correctCount}/${item.totalQuestions} acertos</span>
          </div>
          <div class="prompt">${item.promptSnapshot}</div>
          <div class="meta">Concluido em: ${completedLabel}</div>
          <div class="explanation">${item.explanation || ''}</div>
        `;

        list.appendChild(wrapper);
      });
    }

    async function loadHistory() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Atualizando...';

      try {
        const response = await fetch('/study-history');
        const history = await response.json();
        if (!response.ok) {
          throw new Error(history.error || 'Nao foi possivel carregar o historico.');
        }
        renderHistory(Array.isArray(history) ? history : []);
      } catch (error) {
        renderHistory([]);
        const list = document.getElementById('historyList');
        list.innerHTML = `<div class="empty">Erro ao carregar historico: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Atualizar historico';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadHistory);
    loadHistory();
  </script>
</body>

</html>
