<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="link-da-web.png" type="image/png" />
  <link rel="stylesheet" href="/styles/global.css" />
  <title>Historico de Estudos</title>
  <style>
    .container {
      max-width: 980px;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(2, 6, 23, 0.55);
      animation: rise 0.45s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .top-actions a,
    .top-actions button {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-back {
      background: var(--surface-soft);
      color: var(--bg-primary);
    }

    .btn-study {
      background: var(--color-primary-soft);
      color: var(--color-primary-active);
    }

    .btn-refresh {
      background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary-active));
      color: var(--text-primary);
      box-shadow: 0 10px 18px -10px rgba(37, 99, 235, 0.8);
    }

    .top-actions a:hover,
    .top-actions button:hover {
      transform: translateY(-2px);
    }

    .stats {
      display: grid;
      color: whitesmoke;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      border: 1px solid var(--border-primary);
      border-radius: 14px;
      padding: 0.9rem;
      background: var(--surface-soft);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      color: whitesmoke;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--bg-primary);
    }

    #historyList {
      display: grid;
      gap: 0.75rem;
      max-height: 480px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .history-item {
      border: 1px solid var(--border-primary);
      border-radius: 14px;
      padding: 0.95rem;
      background: var(--bg-surface);
    }

    .history-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .cycle-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.62rem;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-info);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score {
      color: var(--color-success);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .prompt {
      font-weight: 600;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }

    .meta {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border-primary);
      color: var(--text-secondary);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .explanation p { margin: 0 0 0.5rem; }
    .explanation p:last-child { margin-bottom: 0; }

    .explanation ul, .explanation ol {
      padding-left: 1.4rem;
      margin: 0 0 0.5rem;
    }

    .explanation li { margin-bottom: 0.2rem; }

    .explanation code {
      background: var(--surface-muted);
      padding: 0.1em 0.35em;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: var(--color-primary-active);
    }

    .explanation pre {
      background: var(--surface-muted);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    .explanation pre code {
      background: none;
      padding: 0;
      color: var(--text-primary);
    }

    .explanation strong { color: var(--text-primary); }

    .explanation h1, .explanation h2, .explanation h3 {
      margin: 0.6rem 0 0.3rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .empty {
      border: 1px dashed var(--color-primary-border);
      border-radius: 14px;
      background: var(--color-primary-soft);
      color: var(--color-primary-active);
      padding: 1rem;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .container {
        padding: 1.25rem;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>

<body class="theme-history">
  <div class="container">
    <h1>Historico de Estudos</h1>
    <p class="subtitle">Aqui ficam todos os ciclos concluidos. Cada card mostra o tema estudado, o ciclo e quando ele
      foi finalizado.</p>

    <div id="historyApp"></div>
  </div>

  <script type="module" src="/frontend/history/mount.js"></script>
</body>

</html>
