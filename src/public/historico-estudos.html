<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="link-da-web.png" type="image/png" />
  <title>Historico de Estudos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-primary: #0F172A;
      --bg-alt: #111827;
      --bg-surface: #1E293B;
      --surface-card: rgba(30, 41, 59, 0.92);
      --surface-soft: #1E293B;
      --surface-muted: #1F2937;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: rgba(203, 213, 225, 0.82);
      --text-subtle: rgba(203, 213, 225, 0.68);
      --text-disabled: rgba(203, 213, 225, 0.52);
      --color-primary: #3B82F6;
      --color-primary-hover: #60A5FA;
      --color-primary-active: #2563EB;
      --color-primary-soft: rgba(59, 130, 246, 0.16);
      --color-primary-border: rgba(96, 165, 250, 0.42);
      --color-success: #22C55E;
      --color-success-active: #16A34A;
      --color-warning: #EAB308;
      --color-warning-soft: rgba(234, 179, 8, 0.16);
      --color-warning-border: rgba(250, 204, 21, 0.45);
      --color-secondary: #F97316;
      --color-error: #EF4444;
      --color-error-soft: rgba(239, 68, 68, 0.18);
      --color-error-border: rgba(239, 68, 68, 0.44);
      --color-optional: #8B5CF6;
      --color-info: #38BDF8;
      --border-primary: #334155;
      --focus-ring: 0 0 0 3px rgba(59, 130, 246, 0.28);
      --bg-start: var(--bg-primary);
      --bg-end: var(--bg-alt);
      --card: var(--surface-card);
      --text: var(--text-primary);
      --muted: var(--text-muted);
      --accent: var(--color-primary);
      --ok: var(--color-success);
      --line: var(--border-primary);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.2), transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(34, 197, 94, 0.16), transparent 35%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(2, 6, 23, 0.55);
      animation: rise 0.45s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .top-actions a,
    .top-actions button {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-back {
      background: var(--surface-soft);
      color: var(--bg-primary);
    }

    .btn-study {
      background: var(--color-primary-soft);
      color: var(--color-primary-active);
    }

    .btn-refresh {
      background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary-active));
      color: var(--text-primary);
      box-shadow: 0 10px 18px -10px rgba(37, 99, 235, 0.8);
    }

    .top-actions a:hover,
    .top-actions button:hover {
      transform: translateY(-2px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
      background: var(--surface-soft);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--bg-primary);
    }

    #historyList {
      display: grid;
      gap: 0.75rem;
      max-height: 480px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.95rem;
      background: var(--bg-surface);
    }

    .history-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .cycle-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.62rem;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-info);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score {
      color: var(--ok);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .prompt {
      font-weight: 600;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--line);
      color: var(--text-secondary);
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--color-primary-border);
      border-radius: 14px;
      background: var(--color-primary-soft);
      color: var(--color-primary-active);
      padding: 1rem;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .container {
        padding: 1.25rem;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Historico de Estudos</h1>
    <p class="subtitle">Aqui ficam todos os ciclos concluidos. Cada card mostra o tema estudado, o ciclo e quando ele
      foi finalizado.</p>

    <div id="historyApp"></div>
  </div>

  <script type="module" src="/frontend/history/mount.js"></script>
</body>

</html>
